server.port=8080
spring.application.name=kripta-backend

# PostgreSQL via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kripta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway: o schema e gerenciado pelas migrations em src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (variaveis sensiveis ficam fora do codigo-fonte)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
