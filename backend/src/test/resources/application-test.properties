# Profile de teste: H2 em memoria (nao depende de PostgreSQL local)
spring.config.activate.on-profile=test

# As migrations sao escritas em SQL do PostgreSQL, entao nao rodam no H2.
# O schema de teste e criado pelo Hibernate (create-drop).
spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:kriptatest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT fixo apenas para testes
app.jwt.secret=chave-de-teste-kripta-0123456789abcdef0123456789abcdef
app.jwt.expiration-ms=86400000
