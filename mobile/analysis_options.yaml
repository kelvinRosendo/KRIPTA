# Configuração do analisador estático do Dart/Flutter.
#
# Referência: https://dart.dev/tools/analysis-options
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

  # Gera `.g.dart` para DTOs. Erros de "campo não inicializado" nesses
  # arquivos são falsos positivos: o valor vem do `fromJson`.
  errors:
    todo: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Correção ─────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_returning_null_for_void: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_types_as_parameter_names: true
    await_only_futures: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: false
    control_flow_in_finally: true
    curly_braces_in_flow_control_structures: true
    empty_catches: true
    empty_constructor_bodies: true
    implementation_imports: false
    library_names: false
    no_leading_underscores_for_local_identifiers: true
    null_check_on_nullable_type_parameter: true
    prefer_final_fields: true
    prefer_single_quotes: true
    throw_in_finally: true
    unnecessary_await_in_return: true
    unnecessary_breaks: true
    unnecessary_parenthesis: true
    unnecessary_statements: true
    use_string_in_part_of_directives: true
    use_super_parameters: true

    # ── Documentação e legibilidade ──────────────────────────────────
    public_member_api_docs: true
    slash_for_doc_comments: true

    # ── Desativadas de propósito ─────────────────────────────────────
    # `avoid_print`: o logger é a saída oficial (core/logging/app_logger.dart).
    avoid_print: true
    # `prefer_const_constructors`: mantido desligado porque gera
    # suggested (warning) e polui o `flutter analyze`; use
    # `flutter analyze --no-fatal-infos` em CI se quiser zerar.
    prefer_const_constructors: true
    # `require_trailing_commas` gera muito ruído em listas curtas.
    require_trailing_commas: false
    # `sort_child_properties_last` conflita com a convenção de agrupar
    # argumentos nomeados no fim.
    sort_child_properties_last: true
