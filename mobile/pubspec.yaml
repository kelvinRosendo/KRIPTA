name: kripta_mobile
description: "KRIPTA — aplicativo mobile de organização acadêmica (TCC MTEC, 2026)."
publish_to: 'none'

# Versionamento do aplicativo.
# - build-name  -> iOS: CFBundleShortVersionString / Android: versionName
# - build-number-> iOS: CFBundleVersion           / Android: versionCode
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ── Cupertino (ícones no estilo iOS) ───────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Estado e injeção de dependências ───────────────────────────────
  # Riverpod 3.x: usar Provider/Notifier/AsyncNotifier. As APIs legadas
  # (StateProvider/StateNotifierProvider) ficam em `legacy.dart` e não
  # devem ser usadas — ver features/ e core/di/.
  flutter_riverpod: ^3.4.3

  # ── Navegação ──────────────────────────────────────────────────────
  # go_router com `redirect` para guarda de rotas e `ShellRoute` para a
  # bottom navigation. SubstituiNavigator (deprecated no go_router <14).
  go_router: ^18.0.2

  # ── Rede ──────────────────────────────────────────────────────────
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # ── Persistência local ─────────────────────────────────────────────
  # Token JWT em armazenamento seguro (Keychain / EncryptedSharedPreferences).
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # ── Serialização ───────────────────────────────────────────────────
  json_annotation: ^4.12.0
  equatable: ^3.0.0

  # ── Apresentação ───────────────────────────────────────────────────
  intl: ^0.20.3
  # Traduções dos widgets Material (date picker, menus, campos). Sem isso o
  # app funciona, mas os diálogos nativos falam inglês. Já vem do SDK e
  # exige `intl: ^0.20.3`, a mesma versão declarada acima.
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0
  url_launcher: ^6.3.2

  # ── Recursos de hardware / IA (espaço reservado, ver README) ───────
  # Reconhecimento de voz do Kai (UC03). Não é dependência do backend:
  # a transcrição acontece no dispositivo e vira texto para POST /ai/chat.
  speech_to_text: ^7.5.0

  # ── Observabilidade ────────────────────────────────────────────────
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation: json_serializable (DTOs) e riverpod_generator (não usado
  # ainda — os providers são escritos à mão para manter o build determinístico).
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

  # Testes unitários e de widget.
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
